<main>
    <section class="container">

        <h2>Criar publicação</h2>
        <p>Compartilhe seus momentos com a comunidade!</p>

        <form action="index.php?rota=publicacao" method="POST">

            <label>ID do usuário</label>
            <input type="number" name="id_usuario" placeholder="ID do usuário" required>

            <label>Legenda</label>
            <textarea name="legenda" placeholder="O que você está pensando?" required></textarea>

            <label>URL da imagem</label>
            <input type="url" name="imagem_url" placeholder="Cole o link da imagem">

            <button type="submit">Publicar</button>

        </form>

        <p class="link">
            <a href="feed.html">Voltar para o feed</a>
        </p>

    </section>
</main>
